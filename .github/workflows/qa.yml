name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json declares "php": ">=8.1" with no upper bound; these are the oldest supported
        # version and the newest stable releases, so a regression at either end gets caught.
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    # Matches docs/examples/test-databases/docker-compose.yml (same credentials/ports) so the SQL
    # integration tests run for real here instead of skipping. PdoTestConnection connects to fixed
    # 127.0.0.1:3307/5433, so these services publish to those exact host ports.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: uphptime
          MYSQL_DATABASE: uphptime_test
          MYSQL_USER: uphptime
          MYSQL_PASSWORD: uphptime
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping -uroot -puphptime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: uphptime_test
          POSTGRES_USER: uphptime
          POSTGRES_PASSWORD: uphptime
        ports:
          - "5433:5432"
        options: >-
          --health-cmd="pg_isready -U uphptime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, curl, openssl, pdo, pdo_mysql, pdo_pgsql
          tools: composer:v2

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-

      - run: composer install --no-progress --prefer-dist

      # The SQL-backed tests above connect to the service containers and run for real; any
      # environment without them (a contributor's machine without Docker, a stripped-down job)
      # has those same tests skip cleanly instead of failing - see PdoRepositoryTestHelpers.
      - run: composer qa
